<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Tire Service | TirePilot</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{background:#0b0b0b;color:white;font-family:Arial;}
.gold{color:#d4af37;}

.button-primary{
background:linear-gradient(90deg,#d4af37,#ffd966);
color:black;font-weight:bold;
}

.booking-card{
background:rgba(0,0,0,.35);
border:1px solid rgba(212,175,55,.3);
padding:50px;border-radius:20px;
}

.booking-card input,
.booking-card select{
width:100%;padding:16px;border-radius:10px;
border:1px solid #d4af37;background:#132a3a;color:white;
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="flex items-center p-4">
<img src="logo.png" class="h-10">
</header>

<!-- BOOKING -->
<section class="py-10">
<h2 class="text-3xl text-center gold font-bold mb-10">
Request Mobile Tire Service
</h2>

<div class="max-w-2xl mx-auto booking-card">

<form id="bookingForm"
action="https://formsubmit.co/avinashanicanada@gmail.com"
method="POST"
enctype="multipart/form-data"
class="space-y-6">

<input type="hidden" name="Booking Type" id="bookingType" value="Pay Later">
<input type="hidden" name="Priority Service" id="priorityValue" value="No">
<input type="hidden" name="_subject" value="New TirePilot Booking">
<input type="hidden" name="_captcha" value="false">

<input type="text" name="Name" placeholder="Your Name" required>
<input type="tel" name="Phone" placeholder="Phone Number" required>
<input type="text" name="Location" placeholder="Location" required>
<input type="text" name="Vehicle" placeholder="Vehicle Make, Model and Year" required>

<select name="Service">
<option>Off-Rim Tire Change</option>
<option>On-Rim Tire Change</option>
<option>Flat Tire Repair</option>
<option>Wheel Balancing</option>
<option>Tire Rotation</option>
<option>Inspection</option>
</select>

<!-- PRIORITY -->
<div class="flex items-center justify-between border border-yellow-600 p-4 rounded-lg">
<div>
<p class="font-bold">Priority Service (+$10 CAD)</p>
<p class="text-sm text-gray-400">Faster response & top priority technician</p>
</div>

<div id="priorityToggle"
class="w-14 h-8 flex items-center bg-red-600 rounded-full p-1 cursor-pointer transition">
<div id="toggleCircle"
class="bg-white w-6 h-6 rounded-full shadow-md transform transition"></div>
</div>
</div>

<!-- FILE UPLOAD (EXACT SAME AS YOUR SITE) -->
<div class="relative w-full space-y-3">

<button type="button" id="customFileBtn"
class="w-full p-4 rounded-lg border border-yellow-600 bg-[#132a3a] text-white text-left">
<span id="fileText">Upload a photo of your tire (Optional)</span>
</button>

<input type="file" name="Photo" accept="image/*"
id="realFileInput"
class="absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer">

<img id="imagePreview"
class="hidden w-full max-h-48 object-cover rounded-lg border border-yellow-600" />

</div>

<!-- BUTTONS -->
<div class="flex flex-col gap-4">

<button type="submit" class="button-primary w-full py-4 rounded">
Request Service (Pay Later)
</button>

<button type="button" id="payOnlineBtn"
class="w-full py-4 rounded border border-yellow-500 hover:bg-yellow-500 hover:text-black transition">
Book & Pay Online
</button>

</div>

</form>
</div>
</section>

<!-- PAYMENTS -->
<section class="py-10 text-center border-t border-yellow-600/30">
<h2 class="text-2xl gold font-bold mb-6">Payments Accepted</h2>

<div class="flex flex-wrap justify-center items-center gap-8 opacity-80">

<img src="https://logo.svgcdn.com/logos/visa.svg" class="h-8">
<img src="https://download.logo.wine/logo/Interac/Interac-Logo.wine.png" class="h-8">
<img src="https://upload.wikimedia.org/wikipedia/commons/3/30/American_Express_logo.svg" class="h-8">
<img src="https://logos-world.net/wp-content/uploads/2020/09/Mastercard-Symbol.jpg" class="h-8">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR1Wc18EBZ91NV-FfJ_xInlAAOcww6Slu5w-A&s" class="h-8">
<img src="https://vintageclass.it/wp-content/plugins/woocommerce-payments/assets/images/payment-methods/klarna.svg" class="h-8">
<img src="https://www.jockey.com.au/media/wysiwyg/content_pages/BON-O-01582-Afterpay-1225_300.jpg" class="h-8">

</div>
</section>

<!-- FOOTER -->
<footer class="text-center py-8 border-t border-yellow-600/30">
<p class="gold">TirePilot Mobile Tire Service</p>
<p class="mt-2">Phone: +1 647-983-9134</p>
<p class="text-gray-500 mt-6">© 2026 TirePilot | All Rights Reserved</p>
</footer>

<!-- SCRIPT -->
<script>

// PRIORITY TOGGLE (IDENTICAL)
let priorityOn = false;
const toggle = document.getElementById("priorityToggle");
const circle = document.getElementById("toggleCircle");
const priorityInput = document.getElementById("priorityValue");

toggle.addEventListener("click", () => {
priorityOn = !priorityOn;

if(priorityOn){
toggle.classList.remove("bg-red-600");
toggle.classList.add("bg-green-500");
circle.style.transform = "translateX(24px)";
priorityInput.value = "Yes";
}else{
toggle.classList.remove("bg-green-500");
toggle.classList.add("bg-red-600");
circle.style.transform = "translateX(0)";
priorityInput.value = "No";
}
});

// FILE UPLOAD (IDENTICAL)
const fileInput = document.getElementById("realFileInput");
const customBtn = document.getElementById("customFileBtn");
const fileText = document.getElementById("fileText");
const preview = document.getElementById("imagePreview");

customBtn.addEventListener("click", () => {
fileInput.click();
});

fileInput.addEventListener("change", function () {
const file = this.files[0];

if (file) {
const reader = new FileReader();

reader.onload = function (e) {
preview.src = e.target.result;
preview.classList.remove("hidden");
};

reader.readAsDataURL(file);
fileText.textContent = "Photo Uploaded ✅";
}
});

// PAYMENT BUTTON (IDENTICAL)
document.getElementById("payOnlineBtn").addEventListener("click", function(){

const form = document.getElementById("bookingForm");

if (!form.checkValidity()) {
form.reportValidity();
return;
}

document.getElementById("bookingType").value =
priorityOn ? "Paid Online (Priority)" : "Paid Online";

const service = document.querySelector('select[name="Service"]').value;
let paymentLink = "";

// PRIORITY
if(priorityOn){
if(service==="On-Rim Tire Change") paymentLink="https://buy.stripe.com/28EaEP57deIo5nH8xK8Vi06";
if(service==="Off-Rim Tire Change") paymentLink="https://buy.stripe.com/aFadR14390RydUdg0c8Vi07";
if(service==="Flat Tire Repair") paymentLink="https://buy.stripe.com/6oU5kv9ntas8aI1g0c8Vi09";
if(service==="Wheel Balancing") paymentLink="https://buy.stripe.com/bJeaEPczF1VC9DXbJW8Vi08";
if(service==="Tire Rotation") paymentLink="https://buy.stripe.com/28EfZ94396bS4jD6pC8Vi0b";
if(service==="Inspection") paymentLink="https://buy.stripe.com/28EdR17fl57OcQ98xK8Vi0c";
}else{
// NORMAL
if(service==="On-Rim Tire Change") paymentLink="https://buy.stripe.com/00waEPgPVfMs2bv8xK8Vi00";
if(service==="Off-Rim Tire Change") paymentLink="https://buy.stripe.com/7sYcMXbvBgQw8zT6pC8Vi01";
if(service==="Flat Tire Repair") paymentLink="https://buy.stripe.com/bJebITeHNdEk03n7tG8Vi02";
if(service==="Wheel Balancing") paymentLink="https://buy.stripe.com/fZu7sD57d43K5nH9BO8Vi03";
if(service==="Tire Rotation") paymentLink="https://buy.stripe.com/eVqaEP9nt2ZG7vP3dq8Vi04";
if(service==="Inspection") paymentLink="https://buy.stripe.com/9B600beHN43K4jDaFS8Vi05";
}

// SEND + REDIRECT
fetch(form.action,{
method:"POST",
body:new FormData(form)
}).then(()=>{
window.open(paymentLink,"_blank");
});

});
</script>

</body>
</html>
