<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | TirePilot</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #0b0b0b;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .login-container {
    background: rgba(18, 18, 18, 0.95);
    padding: 40px 30px;
    border: 2px solid #d4af37;
    border-radius: 15px;
    text-align: center;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.6);
  }

  h1 {
    color: #d4af37;
    margin-bottom: 30px;
    font-size: 2rem;
  }

  /* Inputs and Button same size */
  input[type="text"], input[type="password"], button {
    width: 100%;
    padding: 14px 0; /* same height for inputs and button */
    margin-bottom: 20px;
    border-radius: 8px;
    font-size: 1.1rem;
    box-sizing: border-box;
  }

  input[type="text"], input[type="password"] {
    border: 1px solid #d4af37;
    background-color: #132a3a;
    color: white;
    text-align: left;
    padding-left: 12px; /* for inner padding */
  }

  input::placeholder {
    color: #ccc;
  }

  button {
    border: none;
    background: linear-gradient(90deg, #d4af37, #ffd966);
    color: black;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s;
  }

  button:hover {
    transform: scale(1.05);
  }

  .error-msg {
    color: #ff4d4d;
    margin-bottom: 15px;
  }

  a.back-home {
    display: inline-block;
    margin-top: 10px;
    color: #d4af37;
    text-decoration: none;
    transition: color 0.3s;
  }
  a.back-home:hover {
    color: #ffd966;
  }
</style>
</head>
<body>

<div class="login-container">
  <h1>Admin Login</h1>

  <form method="POST" action="admin-login.php">
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <a href="/" class="back-home">Back to Home</a>
</div>

</body>
</html>
